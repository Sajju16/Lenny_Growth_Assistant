server {
    listen 3000;
    server_name localhost;

    # Static frontend assets
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Dedicated SSE streaming endpoint: unbuffered, no proxy caching, extended timeout
    location /api/chat/stream {
        proxy_pass http://backend:8000/api/chat/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable proxy buffering for immediate token-by-token SSE streaming
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Extended timeouts for long local model generations (e.g. Ship 30 essays)
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Proxy API requests to FastAPI backend container
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Standard timeout for normal REST endpoints
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Proxy health checks
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
